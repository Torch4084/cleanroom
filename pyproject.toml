[project]
name = "cleanroom"
version = "1.1.0"
description = "GTK4 GUI for managing systemd-nspawn containers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
